<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
            opacity: 0.95;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a2332 50%, #2a3441 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 40px 40px 80px 40px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.3) 0%, transparent 55%),
                radial-gradient(circle at 40% 20%, rgba(120, 219, 255, 0.35) 0%, transparent 65%),
                radial-gradient(circle at 60% 60%, rgba(199, 125, 255, 0.25) 0%, transparent 50%);
            z-index: -1;
            animation: ambientShift 18s ease-in-out infinite, backgroundFlow 25s linear infinite;
        }

        @keyframes ambientShift {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1.2; }
        }

        @keyframes backgroundFlow {
            0% {
                background-position: 0% 0%, 100% 100%, 50% 0%, 75% 50%;
            }
            25% {
                background-position: 25% 25%, 75% 75%, 75% 25%, 50% 75%;
            }
            50% {
                background-position: 50% 50%, 50% 50%, 100% 50%, 25% 100%;
            }
            75% {
                background-position: 75% 75%, 25% 25%, 25% 75%, 100% 25%;
            }
            100% {
                background-position: 100% 100%, 0% 0%, 0% 100%, 0% 0%;
            }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 8px 24px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -1px 0 rgba(0, 0, 0, 0.15);
            padding: 56px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: float 10s ease-in-out infinite, glassShimmer 15s ease-in-out infinite;
            transform-style: preserve-3d;
            perspective: 1200px;
            transform: translateZ(0) rotateX(2deg);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: 
                linear-gradient(135deg, 
                    rgba(255, 255, 255, 0.08) 0%, 
                    rgba(255, 255, 255, 0.02) 30%, 
                    transparent 100%);
            border-radius: 32px 32px 0 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 30%, 
                    rgba(255, 255, 255, 0.06) 0%, 
                    transparent 40%),
                radial-gradient(circle at 70% 70%, 
                    rgba(120, 219, 255, 0.04) 0%, 
                    transparent 50%);
            border-radius: 32px;
            pointer-events: none;
            opacity: 0.4;
            animation: subtleFloat 12s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(2deg); }
            50% { transform: translateY(-12px) rotateX(1deg); }
        }

        @keyframes glassShimmer {
            0%, 100% { 
                backdrop-filter: blur(8px) saturate(120%);
                -webkit-backdrop-filter: blur(8px) saturate(120%);
            }
            50% { 
                backdrop-filter: blur(12px) saturate(140%);
                -webkit-backdrop-filter: blur(12px) saturate(140%);
            }
        }

        @keyframes subtleFloat {
            0%, 100% { 
                transform: translateX(0) translateY(0) scale(1);
                opacity: 0.4;
            }
            33% { 
                transform: translateX(2px) translateY(-1px) scale(1.02);
                opacity: 0.5;
            }
            66% { 
                transform: translateX(-1px) translateY(2px) scale(0.98);
                opacity: 0.3;
            }
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 28px;
            position: relative;
            z-index: 15;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.4),
                0 8px 24px rgba(0, 0, 0, 0.3),
                0 0 0 2px rgba(255, 255, 255, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.15),
                inset 0 0 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            background: 
                linear-gradient(135deg, 
                    rgba(255, 255, 255, 0.1) 0%, 
                    rgba(255, 255, 255, 0.02) 100%);
            transform: translateZ(20px) scale(1);
        }

        .avatar::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(120, 119, 198, 0.4),
                rgba(255, 119, 198, 0.4),
                rgba(120, 219, 255, 0.4));
            border-radius: 50%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: rotate 3s linear infinite;
        }

        .avatar:hover::before {
            opacity: 1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(255, 255, 255, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .name::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, 
                rgba(120, 119, 198, 0.8),
                rgba(255, 119, 198, 0.8),
                rgba(120, 219, 255, 0.8));
            border-radius: 2px;
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .bio {
            font-size: 17px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.96);
            margin-bottom: 36px;
            text-align: left;
            line-height: 1.75;
            letter-spacing: 0.3px;
            background: transparent;
            padding: 28px 24px;
            position: relative;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            max-width: 100%;
        }

        .bio-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .bio-item:last-child {
            margin-bottom: 0;
        }

        .bio-item:hover {
            transform: translateX(2px);
            opacity: 1;
        }

        .bio i {
            margin-right: 12px;
            width: 18px;
            text-align: center;
            color: rgba(120, 219, 255, 0.95);
            font-size: 16px;
            vertical-align: middle;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
            flex-shrink: 0;
        }

        .bio span {
            font-weight: 400;
            opacity: 0.96;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px) saturate(110%);
            -webkit-backdrop-filter: blur(8px) saturate(110%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 18px 28px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 36px rgba(0, 0, 0, 0.25),
                0 4px 12px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            transform: translateZ(8px) rotateX(0.5deg);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-6px) scale(1.025) rotateX(1deg);
            box-shadow: 
                0 15px 45px rgba(0, 0, 0, 0.35),
                0 8px 20px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px) saturate(130%);
            -webkit-backdrop-filter: blur(12px) saturate(130%);
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:active {
            transform: translateY(-2px) scale(1.01);
            transition: all 0.2s ease;
        }

        .link-item i {
            margin-right: 16px;
            font-size: 18px;
            width: 24px;
            text-align: center;
            background: linear-gradient(135deg, #7877c6, #ff77c6, #78dbff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .link-item:hover i {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .link-item span {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 20px 60px 20px;
                align-items: flex-start;
                padding-top: 30px;
            }
            
            .container {
                padding: 24px 18px;
                margin: 15px 0px 15px 0px;
            }
            
            .avatar {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }
            
            .name {
                font-size: 26px;
                margin-bottom: 12px;
            }
            
            .bio {
                font-size: 15px;
                padding: 16px 12px;
                line-height: 1.6;
                letter-spacing: 0.1px;
                margin-bottom: 28px;
            }
            
            .bio i {
                margin-right: 8px;
                width: 15px;
                font-size: 14px;
            }

            .bio-item {
                margin-bottom: 8px;
            }
            
            .link-item {
                padding: 12px 18px;
            }
            
            .links {
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 15px 50px 15px;
                align-items: flex-start;
                padding-top: 25px;
            }
            
            .container {
                padding: 20px 16px;
                margin-bottom: 15px;
            }
            
            .avatar {
                width: 90px;
                height: 90px;
                margin-bottom: 16px;
            }
            
            .name {
                font-size: 24px;
                margin-bottom: 10px;
            }
            
            .bio {
                font-size: 14px;
                padding: 12px 8px;
                line-height: 1.5;
                margin-bottom: 24px;
            }
            
            .bio i {
                margin-right: 6px;
                width: 14px;
                font-size: 13px;
            }

            .bio-item {
                margin-bottom: 6px;
            }
            
            .link-item {
                padding: 10px 16px;
                font-size: 15px;
            }
            
            .link-item i {
                font-size: 16px;
                margin-right: 12px;
            }
            
            .links {
                gap: 10px;
            }

            footer.icp-footer {
                font-size: 11px;
                bottom: 8px;
                padding: 5px 8px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 12px 12px 45px 12px;
                padding-top: 20px;
            }
            
            .container {
                padding: 18px 14px;
                margin-bottom: 12px;
            }
            
            .avatar {
                width: 80px;
                height: 80px;
                margin-bottom: 14px;
            }
            
            .name {
                font-size: 22px;
                margin-bottom: 8px;
            }
            
            .bio {
                font-size: 13px;
                padding: 10px 6px;
                margin-bottom: 20px;
            }
            
            .bio i {
                margin-right: 5px;
                width: 13px;
                font-size: 12px;
            }

            .bio-item {
                margin-bottom: 5px;
            }
            
            .link-item {
                padding: 8px 14px;
                font-size: 14px;
            }
            
            .link-item i {
                font-size: 15px;
                margin-right: 10px;
            }
            
            .links {
                gap: 8px;
            }

            footer.icp-footer {
                font-size: 10px;
                bottom: 6px;
                padding: 4px 6px;
            }
        }
        /* 新增：备案号（ICP备案号）样式 */
        footer.icp-footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
            padding: 8px 20px;
            transition: all 0.3s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        footer.icp-footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        footer.icp-footer a:hover {
            color: rgba(255, 255, 255, 1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                color: #2d3748;
            }

                    radial-gradient(circle at 40% 20%, rgba(120, 219, 255, 0.08) 0%, transparent 50%);
            }
            
            .container {
                background:

                backdrop-filter: blur(60px) saturate(120%);
                -webkit-backdrop-filter: blur(60px) saturate(120%);
                border: 1px solid rgba(255, 255, 255, 0.6);
                box-shadow: 
                    0 16px 48px rgba(0, 0, 0, 0.15),
                    0 2px 8px rgba(0, 0, 0, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6),
                    inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            }
            
            .name {
                background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            .bio {
                background: transparent;
                color: rgba(45, 55, 72, 0.96);
                text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
            }

            .bio span {
                color: rgba(45, 55, 72, 0.95);
                opacity: 1;
            }
            
            .bio i {
                color: rgba(120, 119, 198, 0.9);
            }
            
            .link-item {
                background: 
                    linear-gradient(135deg, 
                        rgba(255, 255, 255, 0.7) 0%, 
                        rgba(255, 255, 255, 0.4) 100%);
                backdrop-filter: blur(32px) saturate(120%);
                -webkit-backdrop-filter: blur(32px) saturate(120%);
                border: 1px solid rgba(255, 255, 255, 0.6);
                color: #2d3748;
                box-shadow: 
                    0 8px 32px rgba(0, 0, 0, 0.12),
                    0 2px 8px rgba(0, 0, 0, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.5),
                    inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            }
            
            .link-item:hover {
                background: rgba(255, 255, 255, 0.8);
                box-shadow: 
                    0 8px 32px rgba(0, 0, 0, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            }
            
            .link-item i {
                background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            footer.icp-footer {
                color: rgba(45, 55, 72, 0.8);
                text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
            }
            
            footer.icp-footer a {
                color: rgba(45, 55, 72, 0.8);
            }
            
            footer.icp-footer a:hover {
                color: rgba(45, 55, 72, 1);
            }
        }
    </style>
